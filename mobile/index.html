<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DeltaVision Mobile</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111'/%3E%3Cpath d='M7 24L16 7l9 17' fill='none' stroke='%234dff88' stroke-width='3.4' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../shared/fonts/inter.css">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="stage">
    <div id="device">
      <div id="screen">
        <canvas class="bg" id="bgTicker"></canvas>
        <canvas class="bg" id="bgPort"></canvas>

        <div class="statusbar" id="statusbar">
          <span id="sbTime">9:41</span>
          <span class="island"></span>
          <span class="sb-icons">
            <svg width="18" height="11" viewBox="0 0 18 11" fill="#fff"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="6" rx="1"/><rect x="10" y="2.5" width="3" height="8.5" rx="1"/><rect x="15" y="0" width="3" height="11" rx="1"/></svg>
            <svg width="16" height="11" viewBox="0 0 16 11" fill="#fff"><path d="M8 2.2c2.300 0 4.400.9 5.900 2.400l1.100-1.100C13.200 1.700 10.700.6 8 .6S2.800 1.700 1 3.500l1.100 1.100C3.600 3.100 5.700 2.200 8 2.200zm0 3.200c1.400 0 2.600.5 3.600 1.400l1.100-1.100C11.500 4.500 9.800 3.800 8 3.800s-3.500.7-4.700 1.900l1.100 1.100c1-.9 2.200-1.400 3.600-1.400zm0 3.100c-.6 0-1.200.2-1.600.6L8 10.700l1.600-1.600c-.4-.4-1-.6-1.600-.6z"/></svg>
            <svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="#fff" opacity=".5"/><rect x="2" y="2" width="17" height="8" rx="1.6" fill="#fff"/><rect x="23.5" y="4" width="1.6" height="4" rx=".8" fill="#fff" opacity=".5"/></svg>
          </span>
        </div>

        <div id="pages">
          <!-- ===================== PORTFOLIO ===================== -->
          <section class="page" id="pgPort" data-page="port">
            <div class="scroll">
              <header class="qhead">
                <button class="qlogo" id="pfLogo" title="Settings"></button>
                <div class="qtitle"><b>Your Portfolio</b><span class="dash">-</span></div>
                <button class="qprice" id="pfQuote" title="Tap to switch between all-time and today"></button>
              </header>
              <div class="chart-wrap">
                <canvas class="pchart" id="pfChart"></canvas>
                <div class="scrub-date" id="pfScrub"></div>
              </div>
              <nav class="tfs" id="pfTfs"></nav>

              <button class="card alerts-card" id="alertsCard">
                <div class="ac-top"><b>Alerts</b><span class="badge" id="alertBadge"></span></div>
                <div class="ac-row"><span class="ac-title" id="alertTitle"></span><span class="ac-date" id="alertDate"></span></div>
              </button>

              <div class="card breakdown">
                <div class="bd-head">
                  <b>Portfolio Breakdown</b>
                  <div class="seg-links" id="bdMode"><button data-mode="today" class="on">Today</button><button data-mode="all">All Time</button></div>
                </div>
                <div id="bdList"></div>
              </div>
              <p class="hint-line">Long-press a row to reorder · tap to open</p>
            </div>
          </section>

          <!-- ===================== TICKER ===================== -->
          <section class="page" id="pgTicker" data-page="ticker">
            <div class="edge" id="edge"></div>
            <div class="scroll">
              <header class="qhead">
                <button class="qlogo" id="tkLogo" title="Add to watchlist"></button>
                <div class="qtitle"><b id="tkSym">$AAPL</b><span class="dash">-</span><span class="qname" id="tkName">Apple Inc.</span></div>
                <div class="qprice" id="tkQuote"></div>
              </header>
              <div class="chart-wrap">
                <canvas class="pchart" id="tkChart"></canvas>
                <div class="scrub-date" id="tkScrub"></div>
              </div>
              <nav class="tfs" id="tkTfs"></nav>

              <div class="actions">
                <button class="btn buy" id="tkBuy">BUY</button>
                <button class="link" id="tkOptions">Options Chain</button>
                <button class="btn sell" id="tkSell">SELL</button>
              </div>

              <button class="card pos-card" id="posCard"></button>

              <h2 class="sec-h">Advanced Securities Details:</h2>
              <h3 class="sub-h">ATM Implied Volatility Term Structure</h3>
              <canvas class="curve" id="ivTerm"></canvas>
              <h3 class="sub-h">30 day Volatility Curve</h3>
              <canvas class="curve tall" id="ivSmile"></canvas>

              <h3 class="sub-h more">Key Statistics</h3>
              <div class="card stats-grid" id="statsGrid"></div>

              <h3 class="sub-h more">About <span id="aboutSym"></span></h3>
              <div class="card about">
                <div class="about-art" id="aboutArt"></div>
                <p id="aboutDesc"></p>
                <button class="ai-pill" id="aiPill">✦ AI stock analysis</button>
                <div class="ai-panel" id="aiPanel" hidden></div>
                <div class="rating"><div class="rating-track"><div class="rating-dot" id="ratingDot"></div></div><div class="rating-labels"><span>BUY</span><span>HOLD</span><span>SELL</span></div></div>
              </div>

              <h3 class="sub-h more">News</h3>
              <div class="card news" id="newsList"></div>
            </div>
          </section>
        </div>

        <button class="corner left" id="btnLeft" title="Portfolio">
          <svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M4 17l5-6 4 3 7-9"/><path d="M5 21v-2M9 21v-5M13 21v-3M17 21v-6"/></svg>
        </button>
        <button class="corner right" id="btnSearch" title="Search">
          <svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6"/></svg>
        </button>
        <div class="home-ind" id="homeInd"><i></i></div>

        <div id="overlay"></div>
      </div>
    </div>
  </div>

  <script src="../shared/core.js"></script>
  <script src="../shared/chart.js"></script>
  <script src="../shared/art.js"></script>
  <script src="../shared/scenes.js"></script>
  <script src="app.js"></script>
</body>
</html>
